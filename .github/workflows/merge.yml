name: Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy, e.g. sha-abc123def...'
        required: false

concurrency:
  group: huggingface-prod-space
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve image
        id: resolve
        if: ${{ !inputs.image_tag }}
        uses: bcgov/actions/image-tracker@main
        with:
          package: agnav
          revision: ${{ github.sha }}
          max_depth: 20

      - name: Promote and Verify to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST: "true"
          IMAGE_TAG: ${{ inputs.image_tag || steps.resolve.outputs.image }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ Failed to resolve image tag." >&2
            exit 1
          fi
          MAX_ATTEMPTS=3
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Attempt $i of $MAX_ATTEMPTS"
            if ./.github/scripts/deploy.sh "bcgeu/navigator" "$IMAGE_TAG"; then
              echo "✅ Deployment succeeded on attempt $i!"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "⚠️ Attempt $i failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Notify Owners on Failure
        if: failure()
        uses: bcgov/actions/workflow-notifier@v0.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "PROD Deployment Failure: Agreement Navigator (AgNav)"
          labels: "critical,deployment,prod"
