name: Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy, e.g. sha-abc123def...'
        required: false

permissions: {}

# Held through deploy-prod. A later run waits, so the gate scores the image this run deployed.
concurrency:
  group: huggingface-test-space
  cancel-in-progress: false

jobs:
  analysis:
    name: Analysis
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-analysis.yml

  deploy-test:
    name: Deploy to HF TEST
    runs-on: ubuntu-latest
    environment: test
    # 20-minute deploy step, 15-minute question step, then the notifier.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: write
    outputs:
      image: ${{ inputs.image_tag || steps.resolve.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve image
        id: resolve
        if: ${{ !inputs.image_tag }}
        uses: bcgov/actions/image-tracker@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          package: agnav
          revision: ${{ github.sha }}
          max_depth: 20

      - name: Promote and Verify to Hugging Face
        timeout-minutes: 20
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST: "true"
          VERIFY_TIMEOUT: "300"
          IMAGE_TAG: ${{ inputs.image_tag || steps.resolve.outputs.image }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ Failed to resolve image tag." >&2
            exit 1
          fi
          MAX_ATTEMPTS=3
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Attempt $i of $MAX_ATTEMPTS"
            if ./.github/scripts/deploy.sh "bcgeu/navigator-test" "$IMAGE_TAG"; then
              echo "✅ Deployment succeeded on attempt $i!"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "⚠️ Attempt $i failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Ask golden questions
        id: golden
        # Script worst case is 765s (see golden_questions.py). Step timeout stays 15 minutes.
        timeout-minutes: 15
        env:
          GOLDEN_QUESTION_TOKEN: ${{ secrets.GOLDEN_QUESTION_TOKEN }}
        run: ./.github/scripts/golden_questions.sh bcgeu/navigator-test

      - name: Notify Owners on Golden Question Failure
        if: failure() && (steps.golden.outcome == 'failure' || steps.golden.outcome == 'cancelled')
        uses: bcgov/actions/workflow-notifier@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Golden Question Failure: Agreement Navigator (AgNav)"
          labels: "critical,deployment,test"

      - name: Notify Owners on Failure
        if: failure() && steps.golden.outcome != 'failure' && steps.golden.outcome != 'cancelled'
        uses: bcgov/actions/workflow-notifier@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "TEST Deployment Failure: Vexilon"
          labels: "failure,deployment,test"

  deploy-prod:
    name: Deploy to HF PROD
    needs: [deploy-test]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: huggingface-prod-space
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Promote and Verify to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST: "true"
          VERIFY_TIMEOUT: "300"
          IMAGE_TAG: ${{ needs.deploy-test.outputs.image }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ Failed to resolve image tag from deploy-test output." >&2
            exit 1
          fi
          MAX_ATTEMPTS=3
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Attempt $i of $MAX_ATTEMPTS"
            if ./.github/scripts/deploy.sh "bcgeu/navigator" "$IMAGE_TAG"; then
              echo "✅ Deployment succeeded on attempt $i!"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "⚠️ Attempt $i failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Notify Owners on Failure
        if: failure()
        uses: bcgov/actions/workflow-notifier@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "PROD Deployment Failure: Agreement Navigator (AgNav)"
          labels: "critical,deployment,prod"

  notify-cancelled:
    name: Notify on Timeout or Cancellation
    needs: [deploy-test, deploy-prod]
    if: always() && contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Notify on timeout or cancellation
        uses: bcgov/actions/workflow-notifier@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Deployment Timed Out or Cancelled: Agreement Navigator (AgNav)"
          labels: "failure,deployment"
