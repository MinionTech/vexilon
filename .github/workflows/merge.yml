name: Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy, e.g. sha-abc123def...'
        required: false

permissions: {}

jobs:
  analysis:
    name: Analysis
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-analysis.yml

  deploy-test:
    name: Deploy to HF TEST
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: huggingface-test-space
      cancel-in-progress: false
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: write
    outputs:
      image: ${{ inputs.image_tag || steps.resolve.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve image
        id: resolve
        if: ${{ !inputs.image_tag }}
        uses: bcgov/actions/image-tracker@01c3fa1c94c8ccea526ce718b40d8a93bb0a2279 # v0.16.0
        with:
          packages: agnav
          revision: ${{ github.sha }}
          max_depth: 20

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Apply Hugging Face Space settings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python -m pip install -r .github/scripts/requirements-space-settings.txt
          python .github/scripts/apply_space_settings.py --repo bcgeu/navigator-test

      - name: Promote and Verify to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST: "true"
          VERIFY_TIMEOUT: "300"
          IMAGE_TAG: ${{ inputs.image_tag || steps.resolve.outputs.image }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ Failed to resolve image tag." >&2
            exit 1
          fi
          MAX_ATTEMPTS=3
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Attempt $i of $MAX_ATTEMPTS"
            if ./.github/scripts/deploy.sh "bcgeu/navigator-test" "$IMAGE_TAG"; then
              echo "✅ Deployment succeeded on attempt $i!"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "⚠️ Attempt $i failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Notify Owners on Failure
        if: failure()
        uses: bcgov/actions/workflow-notifier@01c3fa1c94c8ccea526ce718b40d8a93bb0a2279 # v0.16.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "TEST Deployment Failure: Vexilon"
          labels: "failure,deployment,test"

  deploy-prod:
    name: Deploy to HF PROD
    needs: [deploy-test]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: huggingface-prod-space
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Apply Hugging Face Space settings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python -m pip install -r .github/scripts/requirements-space-settings.txt
          python .github/scripts/apply_space_settings.py --repo bcgeu/navigator --require-var GOATCOUNTER_CODE

      - name: Promote and Verify to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST: "true"
          VERIFY_TIMEOUT: "300"
          IMAGE_TAG: ${{ needs.deploy-test.outputs.image }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ Failed to resolve image tag from deploy-test output." >&2
            exit 1
          fi
          MAX_ATTEMPTS=3
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Attempt $i of $MAX_ATTEMPTS"
            if ./.github/scripts/deploy.sh "bcgeu/navigator" "$IMAGE_TAG"; then
              echo "✅ Deployment succeeded on attempt $i!"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "⚠️ Attempt $i failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Notify Owners on Failure
        if: failure()
        uses: bcgov/actions/workflow-notifier@01c3fa1c94c8ccea526ce718b40d8a93bb0a2279 # v0.16.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "PROD Deployment Failure: Agreement Navigator (AgNav)"
          labels: "critical,deployment,prod"

  notify-cancelled:
    name: Notify on Timeout or Cancellation
    needs: [deploy-test, deploy-prod]
    if: always() && contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Notify on timeout or cancellation
        uses: bcgov/actions/workflow-notifier@01c3fa1c94c8ccea526ce718b40d8a93bb0a2279 # v0.16.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "${{ needs.deploy-test.result == 'cancelled' && 'TEST' || 'PROD' }} Deployment Timed Out or Cancelled: Agreement Navigator (AgNav)"
          labels: "failure,deployment,${{ needs.deploy-test.result == 'cancelled' && 'test' || 'prod' }}"
