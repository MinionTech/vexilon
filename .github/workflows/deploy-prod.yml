name: Deploy PROD

on:
  release:
    types: [published]

permissions: {}

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve image
        id: resolve
        uses: bcgov/actions/image-tracker@main
        with:
          package: agnav
          github_token: ${{ github.token }}
          revision: ${{ github.sha }}
          max_depth: 20

      - name: Promote and Verify to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST: "true"
        run: |
          TAG=$(echo '${{ steps.resolve.outputs.images }}' | jq -r '.agnav')
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Attempt $i of $MAX_ATTEMPTS"
            if ./.github/scripts/deploy.sh "bcgeu/navigator" "$TAG"; then
              echo "✅ Deployment succeeded on attempt $i!"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Attempt $i failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Notify Owners on Failure
        if: failure()
        uses: bcgov/actions/workflow-notifier@v0.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "PROD Deployment Failure: Agreement Navigator (AgNav)"
          labels: "critical,deployment,prod"
