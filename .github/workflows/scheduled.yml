name: Scheduled

on:
  schedule:
    - cron: "0 11 * * 0" # 11:00 UTC on Sundays
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Analysis
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-analysis.yml

  detect-drift:
    name: Detect Document Drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: detect-drift
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "app/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          cd app
          uv sync --frozen

      - name: Run Drift Detection
        id: drift_check
        run: |
          cd app
          set +e
          uv run python scripts/sync_sources.py --check --json --alert-body ../issue_body.md > ../drift_report.json
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          cat ../drift_report.json
          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "::error::Drift detection encountered an operational error (exit code $EXIT_CODE)"
            exit "$EXIT_CODE"
          fi


      - name: File Drift Alert Issue
        if: steps.drift_check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ISSUE=$(gh issue list --search "Drift Detected in Knowledge Base Sources in:title" --state open --json number -q 'if length > 0 then .[0].number | tostring else "" end')
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "An open drift alert issue already exists (#$EXISTING_ISSUE). Skipping duplicate creation."
            exit 0
          fi

          if [ -f issue_body.md ]; then
            gh issue create \
              --title "Drift Detected in Knowledge Base Sources" \
              --body-file issue_body.md \
              --label "documentation"
          fi


