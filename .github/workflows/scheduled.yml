name: Scheduled

on:
  schedule:
    - cron: "0 11 * * 0" # 11:00 UTC on Sundays
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Analysis
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-analysis.yml

  detect-drift:
    name: Detect Document Drift
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: detect-drift
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "app/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          cd app
          uv sync --frozen

      - name: Run Drift Detection
        id: drift_check
        # Exit status (app/scripts/sync_sources.py): bit 1 drift, 2 check error,
        # 4 unreachable source. Drift and unreachable sources are reported together.
        run: |
          cd app
          set +e
          uv run python scripts/sync_sources.py --check --json --alert-body ../issue_body.md > ../drift_report.json
          EXIT_CODE=$?
          set -e
          if ! jq -e 'type == "array"' ../drift_report.json > /dev/null 2>&1; then
            echo "::error::Drift report is missing or not valid JSON (exit code $EXIT_CODE)"
            exit 1
          fi
          cat ../drift_report.json
          if [ "$EXIT_CODE" -gt 7 ]; then
            echo "::error::Drift detection did not run to completion (exit code $EXIT_CODE)"
            exit "$EXIT_CODE"
          fi
          {
            echo "exit_code=$EXIT_CODE"
            echo "drift=$(( EXIT_CODE & 1 ? 1 : 0 ))"
            echo "check_error=$(( EXIT_CODE & 2 ? 1 : 0 ))"
            echo "unreachable=$(( EXIT_CODE & 4 ? 1 : 0 ))"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Document Drift Check"
            echo ""
            echo "- Drifted: $(jq '[.[] | select(.status == "DRIFT_DETECTED")] | length' ../drift_report.json)"
            echo "- Check errors: $(jq '[.[] | select(.status == "ERROR")] | length' ../drift_report.json)"
            echo "- Unreachable: $(jq '[.[] | select(.status == "UNREACHABLE")] | length' ../drift_report.json)"
            if [ $(( EXIT_CODE & 6 )) -ne 0 ]; then
              echo ""
              echo "| Status | Document Path | Upstream URL | Error |"
              echo "| :--- | :--- | :--- | :--- |"
              jq -r '.[] | select(.status == "ERROR" or .status == "UNREACHABLE")
                | "| \(.status) | `\(.path)` | \(.url) | \(.error // "" | gsub("\\|"; "\\|")) |"' ../drift_report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | select(.status == "UNREACHABLE")
            | "::error title=Unreachable source::\(.path) (\(.url)): \(.error)"' ../drift_report.json

      - name: File Drift Alert Issue
        if: steps.drift_check.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ISSUE=$(gh issue list --search "Drift Detected in Knowledge Base Sources in:title" --state open --json number -q 'if length > 0 then .[0].number | tostring else "" end')
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "An open drift alert issue already exists (#$EXISTING_ISSUE). Skipping duplicate creation."
            exit 0
          fi

          if [ -f issue_body.md ]; then
            gh issue create \
              --title "Drift Detected in Knowledge Base Sources" \
              --body-file issue_body.md \
              --label "documentation"
          fi

      - name: Fail on Unreachable Sources or Check Errors
        if: steps.drift_check.outputs.unreachable == '1' || steps.drift_check.outputs.check_error == '1'
        env:
          UNREACHABLE: ${{ steps.drift_check.outputs.unreachable }}
          CHECK_ERROR: ${{ steps.drift_check.outputs.check_error }}
        run: |
          if [ "$UNREACHABLE" = "1" ]; then
            echo "::error::One or more upstream sources could not be reached after retries. See the job summary."
          fi
          if [ "$CHECK_ERROR" = "1" ]; then
            echo "::error::One or more sources failed to check. See the job summary."
          fi
          exit 1
