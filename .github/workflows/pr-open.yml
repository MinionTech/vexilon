name: PR Open

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

env:
  OLLAMA_MODEL_ID: tinyllama
  OLLAMA_DATA_PATH: ./.ollama_data

jobs:
  check:
    name: Check Triggers
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: diff
        uses: bcgov/actions/diff-triggers@main
        with:
          triggers: |
            app/**
            .github/workflows/**
            tests/**
            compose.yml

  prepare-tests:
    name: Prepare Test Cache
    needs: check
    if: needs.check.outputs.triggered == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warm Cache (All Test Targets)
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yml
          targets: dev
          set: |
            *.cache-from=type=gha
            *.cache-from=type=registry,ref=ghcr.io/miniontech/vexilon/agnav:buildcache
            *.cache-to=type=gha,mode=max

  test-unit:
    name: Unit Tests
    needs: check
    if: needs.check.outputs.triggered == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "app/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          cd app
          uv sync --frozen

      - name: Run Deployment Integrity Checks
        run: |
          cd app
          uv run pytest ../tests/deploy_integrity/ -v

      - name: Run Local Unit & Streaming Tests
        env:
          VERIFY_ENABLED: "true"
        run: |
          mkdir -p reports
          cd app
          uv run python -m pytest tests/test_*.py -v \
            --junitxml=../reports/junit.xml \
            --cov=indexing --cov=main --cov-report=xml:../reports/coverage.xml

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: reports/

  validate-cache:
    name: Validate FAISS Cache
    needs: [test-unit, prepare-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Cache (Validator)
        uses: docker/bake-action@v7
        with:
          load: true
          source: .
          files: compose.yml
          targets: dev
          set: |
            *.cache-from=type=gha
            *.cache-from=type=registry,ref=ghcr.io/miniontech/vexilon/agnav:buildcache

      - name: Validate Cache Manifest
        run: docker compose up test-cache

  test-integration-model:
    name: Integration Tests (Model)
    needs: [test-unit, prepare-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Ollama Models
        uses: actions/cache@v6
        with:
          path: ./.ollama_data
          key: ollama-models-${{ env.OLLAMA_MODEL_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Cache (Integration)
        uses: docker/bake-action@v7
        with:
          load: true
          source: .
          files: compose.yml
          targets: dev
          set: |
            *.cache-from=type=gha
            *.cache-from=type=registry,ref=ghcr.io/miniontech/vexilon/agnav:buildcache

      - name: Run Integration Tests
        run: docker compose up test-integration-model

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v || true

  test-integration-app:
    name: Integration Tests (App)
    needs: [test-unit, prepare-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Cache (Functional Tests)
        uses: docker/bake-action@v7
        with:
          load: true
          source: .
          files: compose.yml
          targets: dev
          set: |
            *.cache-from=type=gha
            *.cache-from=type=registry,ref=ghcr.io/miniontech/vexilon/agnav:buildcache

      - name: Run Integration Tests (App)
        run: docker compose up test-integration-app

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v || true

  test-e2e:
    name: End-to-End Tests
    needs: [test-unit, prepare-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Ollama Models
        uses: actions/cache@v6
        with:
          path: ./.ollama_data
          key: ollama-models-${{ env.OLLAMA_MODEL_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Cache (E2E)
        uses: docker/bake-action@v7
        with:
          load: true
          source: .
          files: compose.yml
          targets: dev
          set: |
            *.cache-from=type=gha
            *.cache-from=type=registry,ref=ghcr.io/miniontech/vexilon/agnav:buildcache

      - name: Run E2E Tests
        run: docker compose up test-everything

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v || true

  build:
    name: Build & Push to GHCR
    needs: [test-unit, prepare-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      triggered: ${{ steps.builder.outputs.triggered }}
    steps:
      - name: Build and Push
        id: builder
        uses: bcgov/action-builder-ghcr@main
        with:
          package: agnav
          build_context: app
          build_file: app/Containerfile

  analysis:
    name: Analysis
    uses: ./.github/workflows/reusable-analysis.yml

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Results
    needs: [analysis, build, test-integration-model, test-integration-app, test-e2e, validate-cache]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Critical Check Failure: At least one required job has failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "✅ All critical checks passed or were intentionally skipped!"
