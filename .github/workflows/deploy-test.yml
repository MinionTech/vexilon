name: Deploy TEST

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy, e.g. sha-abc123def...'
        required: false
  push:
    branches:
      - main

permissions: {}

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve image
        id: resolve
        if: ${{ !inputs.image_tag }}
        uses: bcgov/actions/image-tracker@main
        with:
          package: agnav
          github_token: ${{ github.token }}
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
          max_depth: 20

      - name: Promote and Verify to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST: "true"
        run: |
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Attempt $i of $MAX_ATTEMPTS"
            if ./.github/scripts/deploy.sh "bcgeu/navigator-test" "${{ inputs.image_tag || steps.resolve.outputs.image }}"; then
              echo "✅ Deployment succeeded on attempt $i!"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Attempt $i failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "❌ Deployment failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Notify Owners on Failure
        if: failure()
        uses: bcgov/actions/workflow-notifier@v0.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "TEST Deployment Failure: Vexilon"
          labels: "failure,deployment,test"
