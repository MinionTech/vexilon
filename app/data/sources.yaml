#             part heading ("Part 2 —") up to the next part heading. Omit it to keep the whole
#             container. Entries that share a URL must set different part values.
#       category: Document classification (primary | statutory | resources | jurisprudence)
#       content_hash: SHA-256 hash of substantive body content (for drift baseline). Unique across entries.
#       last_synced: ISO date when the document was last synced

