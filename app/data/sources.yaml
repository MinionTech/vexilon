# Declarative Source Registry for Web-Sourced Knowledge Base Documents
# Issue #695: Automate web-sourced document ingestion, provenance tracking, and drift detection.
#
# Schema:
#   sources:
#     - path: Relative path to markdown document within repo (e.g. app/data/03_resources/doc.md)
#       url: Canonical upstream URL
#       type: Ingestion parser strategy (html_selector | bclaws)
#       selector: CSS or container selector to isolate substantive content (e.g. '#body', '#civix-document');
#                 a comma-separated list extracts each listed container in document order
#       part: Optional part number (for example "2"). When set, keep only the text from that
#             part heading ("Part 2 —") up to the next part heading. Omit it to keep the whole
#             container. Entries that share a URL must set different part values.
#       category: Document classification (primary | statutory | resources | jurisprudence)
#       content_hash: SHA-256 hash of substantive body content (for drift baseline). Unique across entries.
#                     A line that, after stripping whitespace, is optional leading "**" plus
#                     "This Act is current to", "This regulation is current to", or
#                     "This consolidation is current to" stays in the markdown and is omitted from this hash.
#       last_synced: ISO date when the document was last synced
#       etag: HTTP ETag from the last --sync that returned 200. Sent as If-None-Match.
#             A 304 response is a MATCH: the body is not read, parsed, or hashed.
#       upstream_last_modified: HTTP Last-Modified from that same 200. Sent as
#             If-Modified-Since. The next 200 replaces both validators.

