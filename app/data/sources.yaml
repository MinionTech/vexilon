# =============================================================================
# Knowledge Base Document Registry (sources.yaml)
# =============================================================================
# Registry for documents managed by sync_sources.py, including fetched sources
# and selected locally maintained sources.
#
# Categories (Hierarchy of Authority):
#   - agreement: Negotiated collective agreements (e.g. BCGEU 20th Main Agreement)
#   - conduct: Core employer conduct & ethics policies (Standards of Conduct, Criminal Notifications)
#   - statutory: Provincial Acts, Codes, and Regulations (Labour Relations Code, OHS, WCA)
#   - resources: Steward reference guides, practice notes, and local bylaws
#   - forms: Administrative dispute and grievance forms
#
# Ingestion Types:
#   - html_selector: Scrapes HTML via CSS selectors into Markdown
#   - bclaws: Extracts BC Laws Civix documents
#   - pdf: Downloads and tracks upstream binary PDF
#   - manual: Staged or maintained directly in-repo (skips HTTP fetching)
#
# Schema:
#   sources:
#     - path: Relative path to document within repo (e.g. app/data/01_primary/doc.md)
#       url: Canonical upstream URL or reference link
#       type: Ingestion parser strategy (html_selector | bclaws | pdf | manual)
#       selector: CSS or container selector to isolate substantive content
#       part: Optional part number for multi-part documents
#       category: Document classification (agreement | conduct | statutory | resources | forms)
#       content_hash: SHA-256 hash of substantive body content (for drift baseline)
#       last_synced: ISO date when the document was last synced
#       etag: Optional HTTP ETag validator
#       upstream_last_modified: Optional HTTP Last-Modified validator
#       extraction_fingerprint: Optional SHA-256 fingerprint of extractor inputs
# =============================================================================

